<!DOCTYPE html>
<html lang="en">

    </style>

<body>

<header>
    <h2>Deriv Trader</h2>
</header>

<div class="container">

    <div id="loginPage" class="card">

        <h1>Welcome</h1>

        <p>
            Connect your Deriv account to continue.
        </p>

        <button id="loginButton" onclick="login()">
            Login with Deriv
        </button>

        <div id="message"></div>

    </div>


    <div id="dashboard" class="card">

        <h1>Deriv Trader</h1>

        <p>
            You are logged in.
        </p>

        <p>
            Your saved login session was detected.
        </p>

        <button id="logoutButton" onclick="logout()">
            Logout
        </button>

    </div>

</div>


<script>

const CLIENT_ID = "34mQW3hmK3j2yzNHV4LdA";

const REDIRECT_URI =
    "https://deriv-gorge.github.io/deriv-trading-site/callback.html";

const AUTH_URL =
    "https://auth.deriv.com/oauth2/auth";

const TOKEN_KEY =
    "deriv_access_token";

const VERIFIER_KEY =
    "deriv_code_verifier";

const STATE_KEY =
    "deriv_oauth_state";


/* ==========================================
   RANDOM STRING
   ========================================== */

function randomString(length) {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    const array =
        new Uint8Array(length);

    crypto.getRandomValues(array);

    let result = "";

    for (let i = 0; i < array.length; i++) {

        result +=
            characters[array[i] % characters.length];

    }

    return result;
}


/* ==========================================
   CREATE PKCE CHALLENGE
   ========================================== */

async function createChallenge(verifier) {

    const data =
        new TextEncoder().encode(verifier);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    let binary = "";

    const bytes =
        new Uint8Array(hash);

    for (const byte of bytes) {

        binary +=
            String.fromCharCode(byte);

    }

    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}


/* ==========================================
   LOGIN
   ========================================== */

async function login() {

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");

    button.disabled = true;

    button.innerText =
        "Connecting...";

    message.innerText =
        "Preparing secure Deriv login...";


    try {

        /* Create verifier */

        const verifier =
            randomString(64);


        /* Create state */

        const state =
            randomString(32);


        /* Create challenge */

        const challenge =
            await createChallenge(verifier);


        /*
         Store temporary OAuth information.
         Deriv requires these for the callback.
        */

        sessionStorage.setItem(
            VERIFIER_KEY,
            verifier
        );

        sessionStorage.setItem(
            STATE_KEY,
            state
        );


        /* Build authorization URL */

        const url =
            new URL(AUTH_URL);


        url.searchParams.set(
            "response_type",
            "code"
        );

        url.searchParams.set(
            "client_id",
            CLIENT_ID
        );

        url.searchParams.set(
            "redirect_uri",
            REDIRECT_URI
        );

        url.searchParams.set(
            "scope",
            "trade"
        );

        url.searchParams.set(
            "state",
            state
        );

        url.searchParams.set(
            "code_challenge",
            challenge
        );

        url.searchParams.set(
            "code_challenge_method",
            "S256"
        );


        /*
         Redirect to Deriv.
        */

        window.location.href =
            url.toString();

    }

    catch (error) {

        console.error(error);

        button.disabled = false;

        button.innerText =
            "Login with Deriv";

        message.innerText =
            "Unable to start Deriv login.";

    }

}


/* ==========================================
   CHECK SAVED LOGIN
   ========================================== */

function checkLogin() {

    const token =
        localStorage.getItem(TOKEN_KEY);


    if (token) {

        document.getElementById(
            "loginPage"
        ).style.display = "none";

        document.getElementById(
            "dashboard"
        ).style.display = "block";

    }

    else {

        document.getElementById(
            "loginPage"
        ).style.display = "block";

        document.getElementById(
            "dashboard"
        ).style.display = "none";

    }

}


/* ==========================================
   LOGOUT
   ========================================== */

function logout() {

    localStorage.removeItem(
        TOKEN_KEY
    );

    sessionStorage.removeItem(
        VERIFIER_KEY
    );

    sessionStorage.removeItem(
        STATE_KEY
    );

    checkLogin();

}


/* ==========================================
   LOAD PAGE
   ========================================== */

window.addEventListener(
    "DOMContentLoaded",
    checkLogin
);

</script>

</body>
</html>
