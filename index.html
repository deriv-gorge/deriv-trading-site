```html
<script>
    /*
     * ==========================================
     * TOKEN STORAGE
     * ==========================================
     *
     * localStorage survives:
     * - page refresh
     * - closing the tab
     * - closing the browser
     *
     * It remains until your code removes it.
     */

    const TOKEN_KEY = "deriv_access_token";


    /*
     * SAVE TOKEN
     */
    function saveToken(token) {

        if (!token || token.trim() === "") {
            console.error("No valid token received.");
            return false;
        }

        localStorage.setItem(TOKEN_KEY, token);

        console.log("Deriv token saved permanently.");

        return true;
    }


    /*
     * GET TOKEN
     */
    function getToken() {

        const token = localStorage.getItem(TOKEN_KEY);

        if (token && token.trim() !== "") {
            return token;
        }

        return null;
    }


    /*
     * CHECK LOGIN
     */
    function checkToken() {

        const token = getToken();

        if (token) {

            console.log("Token found.");

            document.getElementById("loginScreen").style.display =
                "none";

            document.getElementById("dashboard").style.display =
                "block";

        } else {

            console.log("No token found.");

            document.getElementById("loginScreen").style.display =
                "block";

            document.getElementById("dashboard").style.display =
                "none";
        }
    }


    /*
     * ==========================================
     * LOGOUT
     * ==========================================
     *
     * The token is removed ONLY when the user
     * chooses Logout.
     */

    function logout() {

        localStorage.removeItem(TOKEN_KEY);

        console.log("Deriv account logged out.");

        checkToken();
    }


    /*
     * ==========================================
     * CHECK WHEN PAGE OPENS
     * ==========================================
     */

    window.addEventListener("DOMContentLoaded", function () {

        checkToken();

    });
</script>
