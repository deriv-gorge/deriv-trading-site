<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Trader</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>DERIV TRADER</h1>

    <p>Welcome to my Deriv third-party trading site.</p>

    <button onclick="connectDeriv()">Connect Deriv</button>

    <script>
        async function connectDeriv() {

            // Your Deriv OAuth App ID
            const clientId = "34mQW3hmK3J2yzNHV4LdA";

            // Your exact registered redirect URL
            const redirectUri =
                "https://deriv-gorge.github.io/deriv-trading-site/callback.html";

            // Generate a random state
            const state = crypto.randomUUID();

            // Generate PKCE code verifier
            const codeVerifier = generateCodeVerifier();

            // Generate PKCE code challenge
            const codeChallenge =
                await generateCodeChallenge(codeVerifier);

            // Save these for the callback
            sessionStorage.setItem("oauth_state", state);
            sessionStorage.setItem("code_verifier", codeVerifier);

            // Create Deriv OAuth URL
            const oauthUrl =
                "https://auth.deriv.com/oauth2/auth" +
                "?response_type=code" +
                "&client_id=" + encodeURIComponent(clientId) +
                "&redirect_uri=" + encodeURIComponent(redirectUri) +
                "&scope=trade" +
                "&state=" + encodeURIComponent(state) +
                "&code_challenge=" + encodeURIComponent(codeChallenge) +
                "&code_challenge_method=S256";

            // Send user to Deriv
            window.location.href = oauthUrl;
        }

        function generateCodeVerifier() {
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);

            return Array.from(array, byte =>
                byte.toString(16).padStart(2, "0")
            ).join("");
        }

        async function generateCodeChallenge(verifier) {

            const data = new TextEncoder().encode(verifier);

            const digest = await crypto.subtle.digest(
                "SHA-256",
                data
            );

            return btoa(
                String.fromCharCode(...new Uint8Array(digest))
            )
            .replace(/\+/g, "-")
            .replace(/\//g, "_")
            .replace(/=+$/, "");
        }
    </script>

</body>
</html>
