<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deriv Trader</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ff444f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        button {
            padding: 14px 28px;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        #loginButton {
            background: #ff444f;
            color: white;
        }

        #logoutButton {
            background: #333;
            color: white;
        }

        #dashboard {
            display: none;
        }

        #loginPage {
            display: none;
        }

        #message {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h2>Deriv Trader</h2>
</header>

<div class="container">

    <!-- LOGIN PAGE -->
    <div id="loginPage" class="card">

        <h1>Welcome</h1>

        <p>
            Connect your Deriv account to continue.
        </p>

        <button id="loginButton" onclick="login()">
            Login with Deriv
        </button>

        <div id="message"></div>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboard" class="card">

        <h1>Deriv Trader</h1>

        <p>
            You are logged in.
        </p>

        <p id="loginStatus">
            Login session detected.
        </p>

        <button id="logoutButton" onclick="logout()">
            Logout
        </button>

    </div>

</div>


<script>

    /* ==========================================
       YOUR DERIV DETAILS
       ========================================== */

    const CLIENT_ID = "34mQW3hmK3j2yzNHV4LdA";

    const CALLBACK_URL =
        "https://deriv-gorge.github.io/deriv-trading-site/callback.html";


    /* ==========================================
       STORAGE
       ========================================== */

    const TOKEN_KEY = "deriv_access_token";


    /* ==========================================
       CHECK SAVED LOGIN
       ========================================== */

    function checkLogin() {

        const token = localStorage.getItem(TOKEN_KEY);

        if (token && token.trim() !== "") {

            document.getElementById("loginPage").style.display = "none";

            document.getElementById("dashboard").style.display = "block";

        } else {

            document.getElementById("loginPage").style.display = "block";

            document.getElementById("dashboard").style.display = "none";

        }

    }


    /* ==========================================
       LOGIN
       ========================================== */

    function login() {

        const message =
            document.getElementById("message");

        message.innerText =
            "Opening Deriv login...";


        const url =
            new URL("https://auth.deriv.com/oauth2/auth");


        url.searchParams.set(
            "response_type",
            "code"
        );

        url.searchParams.set(
            "client_id",
            CLIENT_ID
        );

        url.searchParams.set(
            "redirect_uri",
            CALLBACK_URL
        );

        url.searchParams.set(
            "scope",
            "trade"
        );


        window.location.href =
            url.toString();

    }


    /* ==========================================
       LOGOUT
       ========================================== */

    function logout() {

        localStorage.removeItem(TOKEN_KEY);

        checkLogin();

    }


    /* ==========================================
       START
       ========================================== */

    window.addEventListener(
        "DOMContentLoaded",
        function() {

            checkLogin();

        }
    );

</script>

</body>
</html>
