<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deriv Login Callback</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .box {
            width: 90%;
            max-width: 500px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        #status {
            margin: 20px 0;
            line-height: 1.6;
            word-break: break-word;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .info {
            color: #333;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #ff444f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Deriv Authentication</h1>

    <div id="status" class="info">
        Processing your login...
    </div>

    <a id="homeButton"
       href="https://deriv-gorge.github.io/deriv-trading-site/"
       style="display:none;">
        Return to Home
    </a>
</div>

<script>
    (function () {

        const status = document.getElementById("status");
        const homeButton = document.getElementById("homeButton");

        const params = new URLSearchParams(window.location.search);

        const code = params.get("code");
        const returnedState = params.get("state");
        const error = params.get("error");
        const errorDescription = params.get("error_description");

        /*
         * 1. Check whether Deriv returned an OAuth error.
         */
        if (error) {
            status.className = "error";

            status.innerHTML =
                "<strong>Login was not completed.</strong><br><br>" +
                "Error: " + escapeHtml(error) +
                (errorDescription
                    ? "<br>" + escapeHtml(errorDescription)
                    : "");

            homeButton.style.display = "inline-block";
            return;
        }

        /*
         * 2. Make sure an authorization code was returned.
         */
        if (!code) {
            status.className = "error";

            status.innerHTML =
                "<strong>No authorization code was received.</strong><br><br>" +
                "Please return to the home page and try again.";

            homeButton.style.display = "inline-block";
            return;
        }

        /*
         * 3. Verify the OAuth state.
         *
         * The login page must have stored oauth_state
         * before redirecting the user to Deriv.
         */
        const savedState = sessionStorage.getItem("oauth_state");

        if (!savedState) {
            status.className = "error";

            status.innerHTML =
                "<strong>Authentication state is missing.</strong><br><br>" +
                "Please start the login process again.";

            homeButton.style.display = "inline-block";
            return;
        }

        if (!returnedState || returnedState !== savedState) {
            status.className = "error";

            status.innerHTML =
                "<strong>Authentication state verification failed.</strong><br><br>" +
                "Please start the login process again.";

            sessionStorage.removeItem("oauth_state");
            sessionStorage.removeItem("pkce_code_verifier");

            homeButton.style.display = "inline-block";
            return;
        }

        /*
         * 4. The OAuth authorization code is valid.
         *
         * IMPORTANT:
         * Do NOT exchange the code for an access token here.
         * Deriv requires the token exchange to happen on your backend.
         *
         * We temporarily save the code so your backend can receive it
         * through your own application flow.
         */
        sessionStorage.removeItem("oauth_state");

        /*
         * IMPORTANT SECURITY NOTE:
         *
         * The authorization code is intentionally NOT displayed
         * on the page.
         */

        status.className = "success";

        status.innerHTML =
            "<strong>Deriv authentication successful.</strong><br><br>" +
            "Authorization was received successfully.<br>" +
            "Your application can now complete the secure server-side token exchange.";

        homeButton.style.display = "inline-block";

        /*
         * Optional automatic return to the home page.
         *
         * Disabled by default so you can see the successful
         * authentication message while testing.
         *
         * To enable it, remove the comments around this block.
         */

        /*
        setTimeout(function () {
            window.location.href =
                "https://deriv-gorge.github.io/deriv-trading-site/";
        }, 2000);
        */

    })();

    /*
     * Safely display values returned in the URL.
     */
    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
