<body>

    <div class="header">
        <h2>Deriv Trader</h2>
    </div>

    <div class="container">

        <!-- LOGIN -->
        <div id="loginPage" class="card login">

            <h1>Welcome</h1>

            <p class="description">
                Connect your Deriv account to continue.
            </p>

            <button
                id="loginButton"
                class="login-button"
                onclick="startLogin()">
                Login with Deriv
            </button>

            <div id="message"></div>

        </div>


        <!-- DASHBOARD -->
        <div id="dashboard" class="card dashboard">

            <h1>Welcome to Deriv Trader</h1>

            <p class="description">
                Your login session has been detected.
            </p>

            <div class="status">
                <strong>Login status:</strong>
                Connected
            </div>

            <button
                class="logout-button"
                onclick="logout()">
                Logout
            </button>

        </div>

    </div>


<script>

    /* =====================================================
       DERIV CONFIGURATION
       ===================================================== */

    const CLIENT_ID = "34mQW3hmK3j2yzNHV4LdA";

    const REDIRECT_URI =
        "https://deriv-gorge.github.io/deriv-trading-site/callback.html";

    const AUTHORIZATION_URL =
        "https://auth.deriv.com/oauth2/auth";


    /* =====================================================
       STORAGE KEYS
       ===================================================== */

    const TOKEN_KEY = "deriv_access_token";

    const VERIFIER_KEY = "deriv_code_verifier";

    const STATE_KEY = "deriv_oauth_state";


    /* =====================================================
       CHECK IF TOKEN EXISTS
       ===================================================== */

    function getToken() {

        return localStorage.getItem(TOKEN_KEY);

    }


    /* =====================================================
       SHOW LOGIN PAGE
       ===================================================== */

    function showLogin() {

        document.getElementById("loginPage").style.display = "block";

        document.getElementById("dashboard").style.display = "none";

    }


    /* =====================================================
       SHOW DASHBOARD
       ===================================================== */

    function showDashboard() {

        document.getElementById("loginPage").style.display = "none";

        document.getElementById("dashboard").style.display = "block";

    }


    /* =====================================================
       RANDOM STRING
       ===================================================== */

    function randomString(length = 64) {

        const characters =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

        const array = new Uint8Array(length);

        crypto.getRandomValues(array);

        let result = "";

        for (let i = 0; i < array.length; i++) {

            result += characters[array[i] % characters.length];

        }

        return result;

    }


    /* =====================================================
       BASE64URL
       ===================================================== */

    function base64UrlEncode(buffer) {

        let binary = "";

        const bytes = new Uint8Array(buffer);

        for (const byte of bytes) {

            binary += String.fromCharCode(byte);

        }

        return btoa(binary)
            .replace(/\+/g, "-")
            .replace(/\//g, "_")
            .replace(/=+$/, "");

    }


    /* =====================================================
       CREATE PKCE CHALLENGE
       ===================================================== */

    async function createCodeChallenge(verifier) {

        const data =
            new TextEncoder().encode(verifier);

        const digest =
            await crypto.subtle.digest(
                "SHA-256",
                data
            );

        return base64UrlEncode(digest);

    }


    /* =====================================================
       START DERIV LOGIN
       ===================================================== */

    async function startLogin() {

        const button =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");

        button.disabled = true;

        button.innerText = "Connecting...";

        message.innerText =
            "Preparing secure Deriv login...";


        try {

            /*
             * Generate PKCE verifier.
             */

            const verifier =
                randomString(64);


            /*
             * Generate state.
             */

            const state =
                randomString(32);


            /*
             * Generate challenge.
             */

            const challenge =
                await createCodeChallenge(verifier);


            /*
             * Save temporary OAuth values.
             *
             * These are intentionally stored in
             * sessionStorage because they belong
             * only to this login attempt.
             */

            sessionStorage.setItem(
                VERIFIER_KEY,
                verifier
            );

            sessionStorage.setItem(
                STATE_KEY,
                state
            );


            /*
             * Build Deriv authorization URL.
             */

            const url =
                new URL(AUTHORIZATION_URL);


            url.searchParams.set(
                "response_type",
                "code"
            );

            url.searchParams.set(
                "client_id",
                CLIENT_ID
            );

            url.searchParams.set(
                "redirect_uri",
                REDIRECT_URI
            );

            url.searchParams.set(
                "scope",
                "trade"
            );

            url.searchParams.set(
                "state",
                state
            );

            url.searchParams.set(
                "code_challenge",
                challenge
            );

            url.searchParams.set(
                "code_challenge_method",
                "S256"
            );


            /*
             * Redirect to Deriv.
             */

            window.location.href =
                url.toString();

        } catch (error) {

            console.error(error);

            button.disabled = false;

            button.innerText =
                "Login with Deriv";

            message.innerText =
                "Unable to start Deriv login.";

        }

    }


    /* =====================================================
       LOGOUT
       ===================================================== */

    function logout() {

        /*
         * Remove the persistent login token.
         */

        localStorage.removeItem(TOKEN_KEY);


        /*
         * Remove temporary OAuth data.
         */

        sessionStorage.removeItem(
            VERIFIER_KEY
        );

        sessionStorage.removeItem(
            STATE_KEY
        );


        /*
         * Return to login page.
         */

        showLogin();

    }


    /* =====================================================
       INITIAL CHECK
       ===================================================== */

    function checkLogin() {

        const token =
            getToken();


        if (token) {

            /*
             * Token exists in localStorage.
             */

            showDashboard();

        } else {

            /*
             * No token exists.
             */

            showLogin();

        }

    }


    /* =====================================================
       START
       ===================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        checkLogin
    );

</script>

</body>
</html>
